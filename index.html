<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hiroyasu IC-980 Pro Max - YSF & CSV Channel Editor</title>
<style>
:root {
  --bg: #12151c; --card: #1c212c; --bd: #2e3646; --fg: #e2e8f0;
  --ac: #2563eb; --ac-h: #1d4ed8; --sel: #1e293b; --warn: #ef4444; --succ: #22c55e;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.4 Arial, sans-serif; }
h1 { font-size: 20px; margin: 0 0 12px; }
.card { background: var(--card); border: 1px solid var(--bd); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
.btn-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
button, input[type="file"]::file-selector-button {
  background: var(--ac); color: #fff; border: 0; border-radius: 6px; padding: 8px 14px;
  font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.15s;
}
button:hover { background: var(--ac-h); }
button.o { background: transparent; color: #94a3b8; border: 1px solid var(--bd); }
button.o:hover { background: var(--bd); color: #fff; }
button.danger { background: var(--warn); }
button:disabled { opacity: 0.4; cursor: not-allowed; }
.file-input { display: inline-flex; align-items: center; gap: 8px; border: 1px dashed var(--bd); padding: 6px 10px; border-radius: 6px; }
.file-input input[type="file"] { display: none; }
.file-name { color: #94a3b8; font-size: 12px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#wrap { max-height: 60vh; overflow: auto; border: 1px solid var(--bd); border-radius: 6px; margin-top: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--bd); white-space: nowrap; }
th { position: sticky; top: 0; background: #252d3d; z-index: 2; }
tr.r { cursor: pointer; }
tr.r:hover { background: #232b3b; }
tr.sel { background: var(--sel) !important; border-left: 3px solid var(--ac); }
input[type="text"], input[type="number"], select {
  background: #11141a; border: 1px solid var(--bd); color: var(--fg); padding: 4px 6px; border-radius: 4px; font-size: 12px;
}
.msg { margin-top: 8px; font-size: 13px; font-weight: bold; }
.err { color: var(--warn); }
.succ { color: var(--succ); }
</style>
</head>
<body>

<h1>Hiroyasu IC-980 Pro Max - YSF & CSV Editor</h1>

<div class="card">
  <div class="btn-group">
    <div class="file-input">
      <button type="button" id="bChooseYsf">Choose .Ysf File</button>
      <span class="file-name" id="ysfFileName">No file selected</span>
      <input type="file" id="fYsf" accept=".ysf,.Ysf">
    </div>
    <div class="file-input">
      <button type="button" id="bChooseCsv">Choose CSV File</button>
      <span class="file-name" id="csvFileName">No file selected</span>
      <input type="file" id="fCsv" accept=".csv">
    </div>
    <button id="bNew" class="o">Create Empty List</button>
  </div>
  <div class="msg" id="info">Select a .Ysf or .CSV file to get started.</div>
</div>

<div class="card">
  <div class="btn-group">
    <button id="bInsEmpty" disabled>+ Insert Empty Channel Before</button>
    <button id="bInsCopy" class="o" disabled>+ Insert Copy Before</button>
    <button id="bMoveUp" class="o" disabled>↑ Move Selected Up</button>
    <button id="bMoveDown" class="o" disabled>↓ Move Selected Down</button>
    <button id="bCopyChannel" class="o" disabled>Copy Selected Channel</button>
    <button id="bPasteChannel" class="o" disabled>Paste Channel After Selected</button>
    <button id="bDel" class="danger" disabled>Delete Selected</button>
    <div style="flex: 1;"></div>
    <button id="bSaveYsf" style="background: var(--succ);" disabled>Save as .Ysf (46 KB / CPS Ready)</button>
  </div>

  <div id="wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Name (up to 16 characters)</th>
          <th>RX (MHz)</th>
          <th>TX (MHz)</th>
          <th>Mode</th>
          <th>TX Tone (PL)</th>
          <th>RX Tone</th>
        </tr>
      </thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
  <div class="msg" id="msg"></div>
</div>

const MAX_CH = 500;            // Tačno 500 kanala

const TAIL_SIZE = 3982;        // Sistemska podešavanja na kraju
const OLD_TAIL_SHIFT = 58;     // stari ugrađeni rep je počinjao na 43122

const FLAG_AM = 0x04;

    [3812,0xB0]

  T.forEach(([o, v]) => rawTail[o + OLD_TAIL_SHIFT] = v);
  if (templateBuf) applyTemplate(templateBuf);
}

const templateReady = Promise.resolve().then(() => {
  const bin = atob(TEMPLATE_B64);
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  if (u.length === TOTAL_FILE_SIZE) { templateBuf = u; applyTemplate(templateBuf); }
});

function initEmpty() {
  initDefaultHeaderAndTail();
  channels = [];
  for (let i = 0; i < 16; i++) {
    channels.push({ name: 'Channel ' + (i + 1), rx: 145.60000, tx: 145.00000, am: false, txTone: 123.0, rxTone: 0 });
  }
  selectedIndex = 0;
  render();
  setMsg('A new empty workspace has been created.', 'succ');
}

function u32le(rec, off) {
  return (rec[off] | rec[off+1]<<8 | rec[off+2]<<16 | rec[off+3]*16777216) >>> 0;
}

// ===== Učitavanje .Ysf binarnog fajla =====
document.getElementById('bChooseYsf').onclick = () => document.getElementById('fYsf').click();
document.getElementById('bChooseCsv').onclick = () => document.getElementById('fCsv').click();
document.getElementById('fYsf').onchange = async (e) => {
  document.getElementById('ysfFileName').textContent = e.target.files[0]?.name || 'No file selected';
  const file = e.target.files[0];
  if (!file) return;
  const buf = new Uint8Array(await file.arrayBuffer());

  if (buf.length < TOTAL_FILE_SIZE) {
    setMsg('Warning: The file is smaller than the standard 47,046 bytes and will be padded when saved.', 'err');
  }

  rawHeader = buf.slice(0, HEADER_SIZE);
  if (buf.length >= TOTAL_FILE_SIZE) {
    rawTail = buf.slice(TAIL_OFFSET, TAIL_OFFSET + TAIL_SIZE);
  } else {
    initDefaultHeaderAndTail();
    rawHeader = buf.slice(0, HEADER_SIZE);
  }

  channels = [];
  const totalSlotsInFile = Math.min(MAX_CH, Math.max(0, Math.floor((Math.min(buf.length, TAIL_OFFSET) - HEADER_SIZE) / REC_SIZE)));

  for (let k = 0; k < totalSlotsInFile; k++) {
    const off = HEADER_SIZE + k * REC_SIZE;
    const rec = buf.slice(off, off + REC_SIZE);

    const rxHz = u32le(rec, F_RX);
    if (rxHz === 0) continue; // Prazno mesto (sve nule)

    let name = '';
    for (let i = F_NAME; i < F_NAME + NAME_LEN; i++) {
      if (rec[i] === 0) break;
      name += String.fromCharCode(rec[i]);
    }

    // 0xFFFF = ton isključen
    const rxTVal = rec[F_RXT] | rec[F_RXT + 1]<<8;
    const rxTone = (rxTVal === 0xFFFF || rxTVal === 0) ? 0 : rxTVal / 10;
    const txTVal = rec[F_TXT] | rec[F_TXT + 1]<<8;
    const txTone = (txTVal === 0xFFFF || txTVal === 0) ? 0 : txTVal / 10;

    channels.push({
      name: name.trim(),
      rx: rxHz / 1e6,
      tx: u32le(rec, F_TX) / 1e6 || rxHz / 1e6,
      am: rec[F_MODE] === 0x90,
      txTone: txTone,
      rxTone: rxTone,
      // Originalni bajtovi zapisa (DCS kodovi, način zapisa "bez tona"...) - čuvaju se pri snimanju
      raw: Array.from(rec),
      orig: { am: rec[F_MODE] === 0x90, txTone, rxTone }
    });
  }

  selectedIndex = channels.length ? 0 : -1;
  render();
  setMsg('Successfully loaded ' + channels.length + ' channels from the .Ysf file.', 'succ');
  e.target.value = '';
};

// ===== Ispravan CSV parser (podržava navodnike i prazna polja) =====
function parseCSVLine(line) {
  const out = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQ) {
      if (c === '"') {
        if (line[i+1] === '"') { cur += '"'; i++; }
        else inQ = false;
      } else cur += c;
    } else if (c === ',') { out.push(cur); cur = ''; }
    else if (c === '"') inQ = true;
    else cur += c;
  }
  out.push(cur);
  return out.map(s => s.trim());
}

// ===== Uvoz CSV (CHIRP) =====
document.getElementById('fCsv').onchange = (e) => {
  document.getElementById('csvFileName').textContent = e.target.files[0]?.name || 'No file selected';
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    const lines = String(evt.target.result).split(/\r?\n/).filter(l => l.trim().length);
    if (lines.length < 2) { setMsg('The CSV file contains no data.', 'err'); return; }

    const head = parseCSVLine(lines[0]).map(s => s.replace(/^"|"$/g, ''));
    const col = (name) => head.indexOf(name);
    const iName = col('Name'), iFreq = col('Frequency'), iDup = col('Duplex'),
          iOff = col('Offset'), iTone = col('Tone'), iRT = col('rToneFreq'),
          iCT = col('cToneFreq'), iCross = col('CrossMode'), iMode = col('Mode');

    initDefaultHeaderAndTail();

    let imported = [], skipped = 0;
    for (let i = 1; i < lines.length; i++) {
      const row = parseCSVLine(lines[i]);
      const g = (idx) => idx >= 0 && idx < row.length ? row[idx].replace(/^"|"$/g, '').trim() : '';

      const rxFreq = parseFloat(g(iFreq));
      if (!rxFreq || !(rxFreq > 0)) { skipped++; continue; }

      const name = (g(iName) || ('CH-' + i)).substring(0, 16);
      const duplex = g(iDup);
      const offset = parseFloat(g(iOff)) || 0;
      let txFreq = rxFreq;
      if (duplex === '-') txFreq = rxFreq - offset;
      else if (duplex === '+') txFreq = rxFreq + offset;
      else if (duplex.toLowerCase() === 'split') txFreq = offset;
      if (!(txFreq > 0)) txFreq = rxFreq;

      // Mapiranje tonskih režima CHIRP-a
      const toneMode = g(iTone);
      const rTone = parseFloat(g(iRT)) || 0;
      const cTone = parseFloat(g(iCT)) || 0;
      const cross = g(iCross) || 'Tone->Tone';
      let txTone = 0, rxTone = 0;
      if (toneMode === 'Tone') {
        txTone = rTone;
      } else if (toneMode === 'TSQL') {
        txTone = rxTone = cTone || rTone;
      } else if (toneMode === 'Cross') {
        const [txSide, rxSide] = cross.split('->');
        if (txSide === 'Tone') txTone = rTone;
        if (rxSide === 'Tone') rxTone = cTone || rTone;
      }

      const mode = g(iMode).toUpperCase();
      const am = (mode === 'NAM' || mode === 'AM');

      imported.push({ name, rx: rxFreq, tx: txFreq, am, txTone, rxTone });
      if (imported.length >= MAX_CH) break;
    }

    if (imported.length) {
      channels = imported;
      selectedIndex = 0;
      render();
      setMsg('Successfully imported ' + imported.length + ' channels from the CSV file' + (skipped ? ' (' + skipped + ' skipped)' : '') + '.', 'succ');
    } else {
      setMsg('No valid channels were found in the CSV file.', 'err');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
};

function render() {
  const tb = document.getElementById('tb');
  tb.innerHTML = '';

  channels.forEach((ch, idx) => {
    const tr = document.createElement('tr');
    tr.className = 'r' + (idx === selectedIndex ? ' sel' : '');
    tr.onclick = (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      selectedIndex = idx;
      render();
    };

    tr.innerHTML = `
      <td>${idx + 1}</td>
      <td><input type="text" maxlength="16" value="${esc(ch.name)}" onchange="channels[${idx}].name=this.value"></td>
      <td><input type="number" step="0.00001" value="${ch.rx.toFixed(5)}" onchange="channels[${idx}].rx=parseFloat(this.value)||0"></td>
      <td><input type="number" step="0.00001" value="${ch.tx.toFixed(5)}" onchange="channels[${idx}].tx=parseFloat(this.value)||0"></td>
      <td><select onchange="channels[${idx}].am=this.value==='1'">
        <option value="0" ${ch.am ? '' : 'selected'}>FM</option>
        <option value="1" ${ch.am ? 'selected' : ''}>AM</option>
      </select></td>
      <td>${genToneSelect(idx, 'txTone', ch.txTone)}</td>
      <td>${genToneSelect(idx, 'rxTone', ch.rxTone)}</td>
    `;
    tb.appendChild(tr);
  });

  document.getElementById('info').textContent = 'Total channels in list: ' + channels.length + ' / ' + MAX_CH;
  const hasSel = selectedIndex >= 0 && selectedIndex < channels.length;
  document.getElementById('bInsEmpty').disabled = !hasSel || channels.length >= MAX_CH;
  document.getElementById('bInsCopy').disabled = !hasSel || channels.length >= MAX_CH;
  document.getElementById('bDel').disabled = !hasSel;
  document.getElementById('bMoveUp').disabled = !hasSel || selectedIndex <= 0;
  document.getElementById('bMoveDown').disabled = !hasSel || selectedIndex >= channels.length - 1;
  document.getElementById('bCopyChannel').disabled = !hasSel;
  document.getElementById('bPasteChannel').disabled = !hasSel || !channelClipboard || channels.length >= MAX_CH;
  document.getElementById('bSaveYsf').disabled = channels.length === 0;
}

function genToneSelect(chIdx, prop, currentVal) {
  let html = `<select onchange="channels[${chIdx}].${prop}=parseFloat(this.value)">`;
  html += `<option value="0" ${currentVal === 0 ? 'selected' : ''}>OFF (No tone)</option>`;
  CTCSS_LIST.forEach(t => {
    const sel = Math.abs(t - currentVal) < 0.1 ? 'selected' : '';
    html += `<option value="${t}" ${sel}>${t.toFixed(1)} Hz</option>`;
  });
  html += `</select>`;
  return html;
}

function esc(s) { return String(s).replace(/"/g, '&quot;'); }
function setMsg(txt, cls) {
  const m = document.getElementById('msg');
  m.className = 'msg ' + (cls || '');
  m.textContent = txt;
}

// ===== Akcije =====
document.getElementById('bInsEmpty').onclick = () => {
  if (selectedIndex < 0 || channels.length >= MAX_CH) return;
  channels.splice(selectedIndex, 0, { name: 'New Channel', rx: 145.600, tx: 145.000, am: false, txTone: 123.0, rxTone: 0 });
  render();
  setMsg('Inserted an empty channel at position #' + (selectedIndex + 1) + '.', 'succ');
};

document.getElementById('bInsCopy').onclick = () => {
  if (selectedIndex < 0 || channels.length >= MAX_CH) return;
  channels.splice(selectedIndex, 0, JSON.parse(JSON.stringify(channels[selectedIndex])));
  render();
  setMsg('Inserted a copy of the channel at position #' + (selectedIndex + 1) + '.', 'succ');
};

document.getElementById('bMoveUp').onclick = () => {
  if (selectedIndex <= 0 || selectedIndex >= channels.length) return;
  [channels[selectedIndex - 1], channels[selectedIndex]] = [channels[selectedIndex], channels[selectedIndex - 1]];
  selectedIndex--;
  render();
  setMsg('Selected channel moved up to position #' + (selectedIndex + 1) + '.', 'succ');
};

document.getElementById('bCopyChannel').onclick = () => {
  if (selectedIndex < 0 || selectedIndex >= channels.length) return;
  channelClipboard = JSON.parse(JSON.stringify(channels[selectedIndex]));
  render();
  setMsg('Selected channel copied to clipboard.', 'succ');
};

document.getElementById('bPasteChannel').onclick = () => {
  if (!channelClipboard || selectedIndex < 0 || channels.length >= MAX_CH) return;
  channels.splice(selectedIndex + 1, 0, JSON.parse(JSON.stringify(channelClipboard)));
  selectedIndex++;
  render();
  setMsg('Channel pasted after the selected channel at position #' + (selectedIndex + 1) + '.', 'succ');
};

document.getElementById('bMoveDown').onclick = () => {
  if (selectedIndex < 0 || selectedIndex >= channels.length - 1) return;
  [channels[selectedIndex], channels[selectedIndex + 1]] = [channels[selectedIndex + 1], channels[selectedIndex]];
  selectedIndex++;
  render();
  setMsg('Selected channel moved down to position #' + (selectedIndex + 1) + '.', 'succ');
};

document.getElementById('bDel').onclick = () => {
  if (selectedIndex < 0) return;
  channels.splice(selectedIndex, 1);
  if (selectedIndex >= channels.length) selectedIndex = channels.length - 1;
  render();
  setMsg('Channel deleted.', 'succ');
};

document.getElementById('bNew').onclick = initEmpty;

// ===== Generisanje .Ysf fajla identičnog strukture referentnom =====
document.getElementById('bSaveYsf').onclick = () => {
  const buf = new Uint8Array(TOTAL_FILE_SIZE); // inicijalno sve nule

  // 1. Zaglavlje (564 B)
  buf.set(rawHeader.subarray(0, HEADER_SIZE), 0);

  // >>> OVDE UMETNUTI NOVI KOD (dinamička bitmaska kanala) >>>
  for (let i = 351; i <= 413; i++) {
    buf[i] = 0x00;
  }
  for (let k = 0; k < channels.length && k < MAX_CH; k++) {
    const chNum = k + 1;
    buf[351 + Math.floor(chNum / 8)] |= (1 << (chNum % 8));
  }
  // <<< KRAJ NOVOG KODA <<<

  const putU32 = (o, v) => {
    buf[o] = v & 0xFF; buf[o + 1] = (v >> 8) & 0xFF;
    buf[o + 2] = (v >> 16) & 0xFF; buf[o + 3] = (v >>> 24) & 0xFF;
  };

  const putTone = (o, typeOff, tone) => {
    if (tone > 0) {
      const t = Math.round(tone * 10);
      buf[o] = t & 0xFF; buf[o + 1] = (t >> 8) & 0xFF;
      buf[typeOff] = 0x01; // CTCSS
    } else {
      buf[o] = 0xFF; buf[o + 1] = 0xFF; buf[typeOff] = 0x00;
    }
  };


  // 2. Zapisi kanala (500 × 85 B), redom kao u listi; neiskorišćena mesta ostaju nule
  for (let k = 0; k < channels.length && k < MAX_CH; k++) {
    const off = HEADER_SIZE + k * REC_SIZE;
    const ch = channels[k];

    const o = ch.orig;
    if (ch.raw) buf.set(ch.raw, off);

    putU32(off + F_RX, Math.round(ch.rx * 1e6) >>> 0);
    putU32(off + F_TX, Math.round(ch.tx * 1e6) >>> 0);
    const rxSame = o && o.rxTone === ch.rxTone, txSame = o && o.txTone === ch.txTone;
    if (!rxSame) putTone(off + F_RXT, off + F_RXT_TYPE, ch.rxTone);
    if (!txSame) putTone(off + F_TXT, off + F_TXT_TYPE, ch.txTone);

    // 0xB0 = FM, 0x90 = AM (vazduhoplovni)
    buf[off + F_MODE] = ch.am ? 0x90 : 0xB0;
    if (!(rxSame && txSame && o.am === ch.am)) {
      buf[off + F_MODE2] = (ch.am ? FLAG_AM : 0) | (buf[off + F_RXT_TYPE] << 4) | (buf[off + F_TXT_TYPE] << 6);
    }

    for (let i = 0; i < NAME_LEN; i++) {
      buf[off + F_NAME + i] = i < ch.name.length ? (ch.name.charCodeAt(i) & 0xFF) : 0;
    }
  }

  // 3. Sistemski rep (3.982 B)
  buf.set(rawTail.subarray(0, TAIL_SIZE), TAIL_OFFSET);

  const blob = new Blob([buf], { type: 'application/octet-stream' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'channels_IC980_export.Ysf';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setMsg('File saved: channels_IC980_export.Ysf (exactly 47,046 bytes - ready for CPS).', 'succ');
};

initEmpty();
templateReady.then(() => { if (templateBuf) applyTemplate(templateBuf); });
